version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    desc: Build Omaclip for Linux
    deps:
      - common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS: '{{if eq .DEV "true"}}{{else}}-tags production{{end}}'
          DEV: '{{.DEV}}'
    vars:
      REVISION:
        sh: git rev-parse --short HEAD
      MODIFIED:
        sh: git diff --quiet && echo false || echo true
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - >-
        go build
        {{if eq .DEV "true"}}-gcflags=all="-l"{{else}}-tags production -trimpath{{end}}
        -buildvcs=false
        -ldflags="-w -s -X github.com/rhemvi/omaclip/foundation/vcs.Revision={{.REVISION}} -X github.com/rhemvi/omaclip/foundation/vcs.Modified={{.MODIFIED}}"
        -o {{.OUTPUT}}
        .
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1

  package:
    cmds:
      - task: build

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
