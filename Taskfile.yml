version: "3"

vars:
  APP_NAME: omaclip
  BIN_DIR: build/bin
  WAILS_VERSION: v3.0.0
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  default:
    cmds:
      - task: app:dev
    silent: true

  build:
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    cmds:
      - task: "{{.GOOS}}:run"

  wails:install:
    desc: Install the pinned Wails CLI version
    internal: true
    cmds:
      - go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}

  frontend:build:
    desc: Build the Vue frontend and regenerate Wails bindings
    deps: [wails:install]
    cmds:
      - task: common:build:frontend

  app:build:
    desc: Build the production application
    deps: [wails:install]
    cmds:
      - wails3 build

  app:dev:
    desc: Start the application in development mode
    deps: [wails:install]
    cmds:
      - wails3 dev -config ./build/config.yml

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  golangci-lint:install:
    desc: Install the pinned golangci-lint version when it is missing or outdated
    internal: true
    vars:
      GOLANGCI_LINT_VERSION: v2.12.2
    status:
      - test "v$(golangci-lint version --short)" = "{{.GOLANGCI_LINT_VERSION}}"
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  lint:
    desc: Run golangci-lint
    deps: [golangci-lint:install]
    cmds:
      - golangci-lint run ./...

  aur:clean:
    desc: Remove downloaded omaclip-linux binaries from build/aur
    dir: build/aur
    cmds:
      - rm -f omaclip-linux-*

  aur:checksums:
    desc: Regenerate checksums and .SRCINFO for the AUR omaclip-bin package
    dir: build/aur
    deps: [aur:clean]
    cmds:
      - updpkgsums
      - makepkg --printsrcinfo > .SRCINFO

  aur:publish:
    desc: Update and push the AUR omaclip-bin package
    dir: build/aur
    deps: [aur:checksums]
    vars:
      VERSION:
        sh: grep '^pkgver=' PKGBUILD | cut -d= -f2
      AUR_REPO: /tmp/omaclip-bin-aur
    cmds:
      - rm -rf {{.AUR_REPO}}
      - git clone ssh://aur@aur.archlinux.org/omaclip-bin.git {{.AUR_REPO}}
      - cp PKGBUILD .SRCINFO omaclip.desktop {{.AUR_REPO}}/
      - cd {{.AUR_REPO}} && git add -A && git commit -m "Update to {{.VERSION}}" && git push
      - rm -rf {{.AUR_REPO}}
